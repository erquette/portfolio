# Runs on every pull request to main or dev.
# Blocks merging if type checking, linting, or the build fails.

name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  ci:
    name: Type check, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci # keeps builds deterministic.

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
